[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recursive-osint"
version = "1.0.0"
description = "Recursive OSINT Discovery Engine - Modular, High-Performance Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Recursive OSINT Architect", email = "security@example.org" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "redis>=5.1.1",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "opensearch-py>=2.7.1",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.1",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
